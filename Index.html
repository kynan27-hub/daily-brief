<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080b12">
<title>Daily Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Instrument+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #080b12;
  --s0:     #0d1117;
  --s1:     #131821;
  --s2:     #1a2030;
  --border: rgba(255,255,255,0.06);
  --bord2:  rgba(255,255,255,0.1);
  --text:   #dde3f0;
  --sub:    #8892a4;
  --dim:    #4a5568;
  --g:      #3ddc84;
  --b:      #4db8ff;
  --p:      #e879f9;
  --y:      #fbbf24;
  --r:      #ff6b6b;
  --o:      #fb923c;
  --gd: linear-gradient(135deg,#3ddc84,#4db8ff);
  --radius: 20px;
  --fh: 'Syne', sans-serif;
  --fb: 'Instrument Sans', sans-serif;
  --fm: 'JetBrains Mono', monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body {
  background:var(--bg);
  color:var(--text);
  font-family:var(--fb);
  min-height:100vh;
  padding-top:env(safe-area-inset-top,0);
  padding-bottom:env(safe-area-inset-bottom,0);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%,rgba(61,220,132,0.08) 0%,transparent 60%),
    radial-gradient(ellipse 60% 40% at 100% 80%,rgba(77,184,255,0.06) 0%,transparent 50%);
  overflow-x:hidden;
}

/* ── TOPBAR ── */
.topbar {
  position:sticky;top:0;z-index:100;
  background:rgba(8,11,18,0.88);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:12px 18px;
  display:flex;align-items:center;gap:10px;
}
.topbar-logo {
  font-family:var(--fh);
  font-size:1.1rem;font-weight:800;
  letter-spacing:0.07em;
  background:var(--gd);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  flex:1;
}
.topbar-clock {
  font-family:var(--fm);
  font-size:0.68rem;
  color:var(--sub);
  text-align:right;
  line-height:1.45;
}
.refresh-btn {
  width:36px;height:36px;border-radius:50%;
  background:var(--s1);border:1px solid var(--bord2);
  color:var(--sub);font-size:1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.25s;flex-shrink:0;
}
.refresh-btn:hover,.refresh-btn:active{color:var(--g);border-color:var(--g);}

/* ── SCROLL WRAP ── */
.scroll-wrap {
  padding:16px;
  display:flex;flex-direction:column;gap:14px;
  max-width:560px;margin:0 auto;
}

/* ── CARD ── */
.card {
  background:var(--s0);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;position:relative;
  opacity:0;
  animation:riseIn 0.55s cubic-bezier(.22,.68,0,1.2) forwards;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);
}
.card:nth-child(1){animation-delay:0.05s}
.card:nth-child(2){animation-delay:0.13s}
.card:nth-child(3){animation-delay:0.21s}
.card:nth-child(4){animation-delay:0.29s}
.card:nth-child(5){animation-delay:0.37s}
.card-inner{padding:20px;}

/* ── SECTION LABEL ── */
.sect-label{
  display:flex;align-items:center;gap:8px;
  font-family:var(--fm);font-size:0.62rem;
  letter-spacing:0.16em;text-transform:uppercase;
  color:var(--sub);margin-bottom:18px;
}
.pdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.pdot.g{background:var(--g);box-shadow:0 0 8px var(--g);animation:blink 3s ease-in-out infinite;}
.pdot.b{background:var(--b);box-shadow:0 0 8px var(--b);animation:blink 3s ease-in-out infinite 0.5s;}
.pdot.p{background:var(--p);box-shadow:0 0 8px var(--p);animation:blink 3s ease-in-out infinite 1s;}
.pdot.y{background:var(--y);box-shadow:0 0 8px var(--y);animation:blink 3s ease-in-out infinite 1.5s;}
.pdot.o{background:var(--o);box-shadow:0 0 8px var(--o);animation:blink 3s ease-in-out infinite 2s;}

/* ══ MARKET ══ */
.spy-hero{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:4px;}
.spy-price{font-family:var(--fh);font-size:2.8rem;font-weight:800;line-height:1;letter-spacing:-0.01em;}
.spy-badge{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.change-chip{
  font-family:var(--fm);font-size:0.75rem;font-weight:500;
  padding:4px 10px;border-radius:999px;white-space:nowrap;
}
.chip-up  {background:rgba(61,220,132,0.12);color:var(--g);border:1px solid rgba(61,220,132,0.2);}
.chip-down{background:rgba(255,107,107,0.12);color:var(--r);border:1px solid rgba(255,107,107,0.2);}
.chip-flat{background:rgba(74,85,104,0.2);color:var(--sub);border:1px solid var(--border);}
.spy-meta{font-family:var(--fm);font-size:0.65rem;color:var(--sub);margin-bottom:16px;}
.chart-wrap{position:relative;height:72px;margin-bottom:16px;}
.chart-wrap svg{width:100%;height:100%;overflow:visible;}
.spy-changes{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.change-box{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
.cb-lbl{font-family:var(--fm);font-size:0.58rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--sub);margin-bottom:6px;}
.cb-val{font-family:var(--fh);font-size:1.35rem;font-weight:700;}
.up{color:var(--g);}.down{color:var(--r);}.flat{color:var(--sub);}
.data-age{font-family:var(--fm);font-size:0.6rem;color:var(--dim);margin-top:10px;text-align:right;}
.data-age.warn{color:var(--y);}

/* ══ WEATHER ══ */
.wx-current{display:flex;align-items:center;gap:16px;margin-bottom:16px;}
.wx-icon{font-size:3rem;line-height:1;filter:drop-shadow(0 0 16px rgba(77,184,255,0.5));flex-shrink:0;}
.wx-temp{font-family:var(--fh);font-size:2.8rem;font-weight:800;line-height:1;color:var(--b);}
.wx-desc{font-size:0.82rem;color:var(--sub);margin-top:2px;}
.wx-feels{font-size:0.72rem;color:var(--dim);margin-top:2px;font-family:var(--fm);}
.wx-stats{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;}
.wx-pill{
  background:var(--s1);border:1px solid var(--border);
  border-radius:999px;padding:5px 11px;
  font-size:0.7rem;display:flex;align-items:center;gap:5px;
  color:var(--sub);font-family:var(--fm);
}
.wx-pill strong{color:var(--text);font-weight:500;}

/* precip bar */
.precip-box{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px;}
.precip-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.precip-ttl{font-family:var(--fm);font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--sub);}
.precip-amt{font-family:var(--fm);font-size:0.72rem;color:var(--b);font-weight:500;}
.pbar-bg{height:6px;background:rgba(255,255,255,0.05);border-radius:999px;overflow:hidden;}
.pbar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--b),var(--p));transition:width 0.8s cubic-bezier(.22,.68,0,1.2);}

/* hourly */
.hourly-box{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px;}
.hourly-ttl{font-family:var(--fm);font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--sub);margin-bottom:11px;}
.hourly-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.h-slot{text-align:center;background:rgba(255,255,255,0.025);border:1px solid var(--border);border-radius:10px;padding:8px 3px;}
.h-time{font-family:var(--fm);font-size:0.56rem;color:var(--sub);margin-bottom:4px;}
.h-icon{font-size:1.05rem;margin-bottom:3px;}
.h-temp{font-family:var(--fm);font-size:0.82rem;font-weight:500;color:var(--text);}
.h-rain{font-family:var(--fm);font-size:0.56rem;color:var(--b);margin-top:2px;}

/* forecast */
.fcast-ttl{font-family:var(--fm);font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--sub);margin-bottom:10px;}
.fcast-list{display:flex;flex-direction:column;gap:6px;}
.fcast-row{
  display:grid;grid-template-columns:58px 1.1rem 1fr 30px 32px 36px;
  align-items:center;gap:8px;
  background:rgba(255,255,255,0.02);border:1px solid var(--border);
  border-radius:10px;padding:9px 12px;
}
.fd-day{font-family:var(--fm);font-size:0.65rem;color:var(--sub);}
.fd-icon{font-size:0.95rem;text-align:center;}
.fd-bar{position:relative;height:4px;background:rgba(255,255,255,0.05);border-radius:999px;}
.fd-bar-f{position:absolute;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--b),var(--g));}
.fd-lo{font-family:var(--fm);font-size:0.65rem;color:var(--dim);text-align:right;}
.fd-hi{font-family:var(--fm);font-size:0.65rem;color:var(--text);font-weight:500;text-align:right;}
.fd-rain{font-family:var(--fm);font-size:0.6rem;color:var(--b);text-align:right;}

/* ══ NEWS ══ */
.news-item{
  background:var(--s1);border:1px solid var(--border);
  border-radius:14px;padding:14px 16px;margin-bottom:10px;
  transition:border-color 0.2s,transform 0.15s;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.news-item:last-child{margin-bottom:0;}
.news-item:active{transform:scale(0.98);}
.news-item:hover{border-color:rgba(251,191,36,0.3);}
.news-num{font-family:var(--fm);font-size:0.57rem;letter-spacing:0.12em;color:var(--y);text-transform:uppercase;margin-bottom:6px;}
.news-hed{font-family:var(--fh);font-size:0.92rem;font-weight:600;line-height:1.35;margin-bottom:5px;color:var(--text);}
.news-src{font-family:var(--fm);font-size:0.6rem;color:var(--dim);}

/* ══ FACTS / MESSAGES ══ */
.item-stack{display:flex;flex-direction:column;gap:10px;}
.fact-card,.msg-card{
  background:var(--s1);border:1px solid var(--border);
  border-radius:14px;padding:14px 16px;position:relative;overflow:hidden;
  transition:border-color 0.2s;
}
.fact-card::after{
  content:'';position:absolute;top:0;left:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--g),var(--b));border-radius:3px 0 0 3px;
}
.fact-card:hover{border-color:rgba(61,220,132,0.25);}
.msg-card::after{
  content:'';position:absolute;top:0;left:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--p),var(--o));border-radius:3px 0 0 3px;
}
.msg-card:hover{border-color:rgba(232,121,249,0.25);}
.item-lbl{font-family:var(--fm);font-size:0.57rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--sub);margin-bottom:6px;padding-left:8px;}
.item-txt{font-size:0.845rem;line-height:1.65;color:var(--text);padding-left:8px;}

/* ── SKELETON ── */
.sk{
  background:linear-gradient(90deg,rgba(255,255,255,0.04) 25%,rgba(255,255,255,0.08) 50%,rgba(255,255,255,0.04) 75%);
  background-size:200% 100%;
  animation:shimmer 1.6s infinite;
  border-radius:6px;
}
.sk-l{height:0.82em;margin:5px 0;}
.sk-b{border-radius:12px;}

/* ── ANIMATIONS ── */
@keyframes riseIn{
  from{opacity:0;transform:translateY(14px) scale(0.98);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
@keyframes shimmer{
  0%{background-position:-200% 0;}100%{background-position:200% 0;}
}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.2;}}
@keyframes spin{to{transform:rotate(360deg);}}
.spinning{animation:spin 0.7s linear infinite;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">DAILY BRIEF</div>
  <div class="topbar-clock" id="live-clock">--:--<br>---</div>
  <button class="refresh-btn" id="refresh-btn" onclick="initAll()">↻</button>
</div>

<div class="scroll-wrap">

  <!-- MARKET -->
  <div class="card" id="card-market">
    <div class="card-inner">
      <div class="sect-label"><span class="pdot g"></span>SPY · S&amp;P 500 ETF</div>
      <div id="market-body">
        <div class="sk sk-b" style="height:2.8rem;width:50%;margin-bottom:8px;"></div>
        <div class="sk sk-l" style="width:38%;margin-bottom:18px;"></div>
        <div class="sk sk-b" style="height:72px;margin-bottom:14px;"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div class="sk sk-b" style="height:62px;"></div>
          <div class="sk sk-b" style="height:62px;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- WEATHER -->
  <div class="card" id="card-weather">
    <div class="card-inner">
      <div class="sect-label"><span class="pdot b"></span>Weather · St. Albert, AB</div>
      <div id="weather-body">
        <div class="sk sk-b" style="height:2.8rem;width:55%;margin-bottom:14px;"></div>
        <div class="sk sk-l" style="width:75%;margin-bottom:18px;"></div>
        <div class="sk sk-b" style="height:80px;margin-bottom:12px;"></div>
        <div class="sk sk-b" style="height:100px;margin-bottom:12px;"></div>
        <div class="sk sk-b" style="height:160px;"></div>
      </div>
    </div>
  </div>

  <!-- NEWS -->
  <div class="card" id="card-news">
    <div class="card-inner">
      <div class="sect-label"><span class="pdot y"></span>Top News · Today</div>
      <div id="news-body">
        <div class="sk sk-b" style="height:70px;margin-bottom:10px;"></div>
        <div class="sk sk-b" style="height:70px;margin-bottom:10px;"></div>
        <div class="sk sk-b" style="height:70px;"></div>
      </div>
    </div>
  </div>

  <!-- FACTS -->
  <div class="card" id="card-facts">
    <div class="card-inner">
      <div class="sect-label"><span class="pdot o"></span>Daily Facts</div>
      <div id="facts-body" class="item-stack">
        <div class="sk sk-b" style="height:62px;"></div>
        <div class="sk sk-b" style="height:62px;"></div>
        <div class="sk sk-b" style="height:62px;"></div>
      </div>
    </div>
  </div>

  <!-- MESSAGES -->
  <div class="card" id="card-messages">
    <div class="card-inner">
      <div class="sect-label"><span class="pdot p"></span>Sweet Messages</div>
      <div id="messages-body" class="item-stack">
        <div class="sk sk-b" style="height:62px;"></div>
        <div class="sk sk-b" style="height:62px;"></div>
        <div class="sk sk-b" style="height:62px;"></div>
      </div>
    </div>
  </div>

</div>

<!-- Hidden SVG gradients for chart -->
<svg width="0" height="0" style="position:absolute;pointer-events:none;">
  <defs>
    <linearGradient id="areaGradG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3ddc84" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3ddc84" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="areaGradR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>

<script>
/* ── DATA ── */

  "Your body has enough iron to make a 3-inch nail.",

  "There are more atoms in a glass of water than glasses of water in all Earth's oceans."
];
const MESSAGES=[
  "Every time I think of you, I smile without even realizing it. You make ordinary days feel like gifts.",
  "You are my favourite notification, my favourite interruption, and my favourite distraction — all at once.",
  "I didn't know what 'home' really felt like until I had you to come home to.",

  "You have this incredible way of making the world feel a little less complicated.",
  "The way you care for people around you is one of the most beautiful things I've ever witnessed.",
  "I could travel the whole world and never find anyone I'd rather share a life with.",
  "You are the best part of every story I tell about my life.",
  "I'm not sure what I did to deserve you, but I'm not going to question it.",
  "You make being loved feel safe, and that is no small thing.",
  "Some days, just knowing you exist in the world makes everything feel more manageable.",
  "I love how you laugh — fully, without apology. It's one of my favourite sounds.",
  "Thank you for being someone I can be completely myself around. That's rare, and I don't take it for granted.",
  "You are intelligent, kind, funny, and somehow also mine. I win.",
  "Being loved by you is the greatest privilege of my life.",
  "I love the life we've built together, and I love that we're not done building yet.",
  "You're the reason I believe that the best things in life really do last.",
  "Just in case no one told you today — you are doing an amazing job, and you are deeply loved."
];
const WX_ICON={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌧️',55:'🌧️',
  61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',73:'❄️',75:'❄️',77:'🌨️',80:'🌦️',81:'🌧️',82:'🌧️',
  85:'🌨️',86:'❄️',95:'⛈️',96:'⛈️',99:'⛈️'};
const WX_DESC={0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',
  45:'Foggy',48:'Icy fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',
  61:'Light rain',63:'Rain',65:'Heavy rain',71:'Light snow',73:'Snow',75:'Heavy snow',
  77:'Snow grains',80:'Showers',81:'Heavy showers',82:'Violent showers',
  85:'Snow showers',86:'Heavy snow showers',95:'Thunderstorm',96:'Thunderstorm + hail',99:'Thunderstorm + heavy hail'};
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

/* ── UTILS ── */
function pick3(a){return[...a].sort(()=>Math.random()-0.5).slice(0,3);}
function fmtPct(v){
  if(v==null||isNaN(v))return{txt:'N/A',cls:'flat'};
  const cls=v>0.05?'up':v<-0.05?'down':'flat';
  return{txt:(v>=0?'+':'')+v.toFixed(2)+'%',cls};
}
function chip(p){
  const cc=p.cls==='up'?'chip-up':p.cls==='down'?'chip-down':'chip-flat';
  return`<span class="change-chip ${cc}">${p.txt}</span>`;
}
function dirArrow(deg){return['↑','↗','→','↘','↓','↙','←','↖'][Math.round(deg/45)%8];}

/* ── CLOCK ── */
function tick(){
  const n=new Date();
  document.getElementById('live-clock').innerHTML=
    n.toLocaleTimeString('en-CA',{hour:'2-digit',minute:'2-digit',hour12:true})+
    '<br>'+n.toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'});
}
setInterval(tick,1000);tick();

/* ── CHART ── */
function buildChart(prices,isUp){
  const W=300,H=72,P=4;
  const mn=Math.min(...prices),mx=Math.max(...prices),rng=mx-mn||1;
  const pts=prices.map((p,i)=>[P+(i/(prices.length-1))*(W-P*2), H-P-((p-mn)/rng)*(H-P*2)]);
  const path=pts.map((p,i)=>(i===0?`M${p[0]},${p[1]}`:`L${p[0]},${p[1]}`)).join(' ');
  const area=`${path} L${pts[pts.length-1][0]},${H} L${pts[0][0]},${H} Z`;
  const c=isUp?'var(--g)':'var(--r)';
  const gid=isUp?'areaGradG':'areaGradR';
  const lp=pts[pts.length-1];
  return`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="${P}" y1="${H/2}" x2="${W-P}" y2="${H/2}" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${path}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${lp[0]}" cy="${lp[1]}" r="3.5" fill="var(--bg)" stroke="${c}" stroke-width="2"/>
  </svg>`;
}

/* ── MARKET ── */
async function loadMarket(){
  const el=document.getElementById('market-body');
  try{
    const url='https://query1.finance.yahoo.com/v8/finance/chart/SPY?range=1mo&interval=1d&includePrePost=false';
    const proxy='https://api.allorigins.win/get?url='+encodeURIComponent(url);
    const r=await fetch(proxy,{cache:'no-cache'});
    const w=await r.json();
    const data=JSON.parse(w.contents);
    const res=data.chart.result[0];
    const closes=res.indicators.quote[0].close;
    const timestamps=res.timestamp;
    const meta=res.meta;
    const valid=closes.map((c,i)=>[timestamps[i],c]).filter(p=>p[1]!=null);
    const last=valid[valid.length-1];
    const prev1d=valid[valid.length-2];
    const prev5d=valid[Math.max(0,valid.length-6)];
    const prev21d=valid[0];
    const cur=meta.regularMarketPrice??last[1];
    const prevClose=meta.chartPreviousClose??prev1d[1];
    const ch1d=((cur-prevClose)/prevClose)*100;
    const ch1w=((cur-prev5d[1])/prev5d[1])*100;
    const ch1m=((cur-prev21d[1])/prev21d[1])*100;
    const d1=fmtPct(ch1d),d1w=fmtPct(ch1w),d1m=fmtPct(ch1m);
    const isUp=ch1w>=0;
    const weekPrices=valid.slice(-6).map(p=>p[1]);
    const lastTs=last[0]*1000;
    const ageMin=(Date.now()-lastTs)/60000;
    const ageNote=ageMin>20&&ageMin<1440
      ?`<div class="data-age warn">⚠ Data ${Math.round(ageMin)} min old — may be delayed</div>`
      :`<div class="data-age">As of ${new Date(lastTs).toLocaleTimeString('en-CA',{hour:'2-digit',minute:'2-digit'})} · ${Math.round(ageMin)} min ago</div>`;
    el.innerHTML=`
      <div class="spy-hero">
        <div class="spy-price">$${cur.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        <div class="spy-badge">
          ${chip(d1w)}
          <span style="font-family:var(--fm);font-size:0.58rem;color:var(--dim);text-align:right;">week</span>
        </div>
      </div>
      <div class="spy-meta">${chip(d1)} today</div>
      <div class="chart-wrap">${buildChart(weekPrices,isUp)}</div>
      <div class="spy-changes">
        <div class="change-box"><div class="cb-lbl">Daily</div><div class="cb-val ${d1.cls}">${d1.txt}</div></div>
        <div class="change-box"><div class="cb-lbl">Monthly</div><div class="cb-val ${d1m.cls}">${d1m.txt}</div></div>
      </div>
      ${ageNote}`;
  }catch(e){
    el.innerHTML=`<div style="color:var(--sub);padding:16px 0;font-size:0.82rem;">📡 Market data unavailable.<br><span style="font-family:var(--fm);font-size:0.62rem;color:var(--dim);">${e.message}</span></div>`;
  }
}

/* ── WEATHER ── */
async function loadWeather(){
  const el=document.getElementById('weather-body');
  const lat=53.6328,lon=-113.6244;
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
      +`&current=temperature_2m,apparent_temperature,weathercode,windspeed_10m,winddirection_10m,relativehumidity_2m`
      +`&hourly=temperature_2m,weathercode,precipitation_probability,precipitation`
      +`&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,windspeed_10m_max`
      +`&timezone=America%2FEdmonton&forecast_days=7&temperature_unit=celsius&windspeed_unit=kmh`;
    const r=await fetch(url);
    const d=await r.json();
    const cur=d.current,daily=d.daily,hourly=d.hourly;
    const icon=WX_ICON[cur.weathercode]??'🌡️';
    const desc=WX_DESC[cur.weathercode]??'Unknown';

    // precip today
    const todayPrecip=daily.precipitation_sum[0]??0;
    const todayRainPct=daily.precipitation_probability_max[0]??0;
    const isSnow=[71,73,75,77,85,86].includes(daily.weathercode[0]);
    const precipLabel=isSnow?'❄️ Snow':'☔ Rain';
    const precipUnit=isSnow?'mm snow':'mm';

    // hourly slots: 8am, 12pm, 4pm, 8pm, 12am next
    const todayStr=daily.time[0];
    const targetH=[8,12,16,20,24];
    const targetL=['8 AM','12 PM','4 PM','8 PM','12 AM'];
    const slots=targetH.map((h,idx)=>{
      let ds=todayStr,hh=h;
      if(h===24){const nd=new Date(todayStr+'T00:00:00');nd.setDate(nd.getDate()+1);ds=nd.toISOString().slice(0,10);hh=0;}
      const tgt=`${ds}T${String(hh).padStart(2,'0')}:00`;
      const i=hourly.time.indexOf(tgt);
      if(i<0)return null;
      return{label:targetL[idx],temp:Math.round(hourly.temperature_2m[i]),code:hourly.weathercode[i],rain:hourly.precipitation_probability[i]??0};
    }).filter(Boolean);

    const hourlyHtml=slots.map(s=>`
      <div class="h-slot">
        <div class="h-time">${s.label}</div>
        <div class="h-icon">${WX_ICON[s.code]??'🌡️'}</div>
        <div class="h-temp">${s.temp}°</div>
        <div class="h-rain">${s.rain}%</div>
      </div>`).join('');

    // 7-day
    const allLo=daily.temperature_2m_min,allHi=daily.temperature_2m_max;
    const absLo=Math.min(...allLo),absHi=Math.max(...allHi),rng=absHi-absLo||1;
    const forecastHtml=daily.time.map((t,i)=>{
      const dt=new Date(t+'T12:00:00');
      const dn=i===0?'Today':i===1?'Tomorrow':DAYS[dt.getDay()];
      const lo=Math.round(allLo[i]),hi=Math.round(allHi[i]);
      const bl=((lo-absLo)/rng)*100,bw=Math.max(((hi-lo)/rng)*100,8);
      const rain=daily.precipitation_probability_max[i]??0;
      return`<div class="fcast-row">
        <div class="fd-day">${dn}</div>
        <div class="fd-icon">${WX_ICON[daily.weathercode[i]]??'🌡️'}</div>
        <div class="fd-bar"><div class="fd-bar-f" style="left:${bl}%;width:${bw}%;"></div></div>
        <div class="fd-lo">${lo}°</div>
        <div class="fd-hi">${hi}°</div>
        <div class="fd-rain">${rain>0?rain+'%':'-'}</div>
      </div>`;
    }).join('');

    el.innerHTML=`
      <div class="wx-current">
        <div class="wx-icon">${icon}</div>
        <div>
          <div class="wx-temp">${Math.round(cur.temperature_2m)}°C</div>
          <div class="wx-desc">${desc}</div>
          <div class="wx-feels">Feels like ${Math.round(cur.apparent_temperature)}°C</div>
        </div>
      </div>
      <div class="wx-stats">
        <div class="wx-pill">💨 <strong>${Math.round(cur.windspeed_10m)} km/h</strong> ${dirArrow(cur.winddirection_10m)}</div>
        <div class="wx-pill">💧 <strong>${cur.relativehumidity_2m}%</strong></div>
        <div class="wx-pill">🌡️ <strong>${Math.round(allLo[0])}° – ${Math.round(allHi[0])}°</strong></div>
      </div>
      <div class="precip-box">
        <div class="precip-hdr">
          <div class="precip-ttl">${precipLabel} chance today</div>
          <div class="precip-amt">${todayRainPct}% · ${todayPrecip} ${precipUnit}</div>
        </div>
        <div class="pbar-bg"><div class="pbar-fill" style="width:${todayRainPct}%;"></div></div>
      </div>
      <div class="hourly-box">
        <div class="hourly-ttl">🕐 Today's temperatures</div>
        <div class="hourly-grid">${hourlyHtml}</div>
      </div>
      <div class="fcast-ttl">📅 7-Day Forecast</div>
      <div class="fcast-list">${forecastHtml}</div>`;
  }catch(e){
    el.innerHTML=`<div style="color:var(--sub);padding:16px 0;font-size:0.82rem;">Weather unavailable.<br><span style="font-family:var(--fm);font-size:0.62rem;color:var(--dim);">${e.message}</span></div>`;
  }
}

/* ── NEWS ── */
async function loadNews(){
  const el=document.getElementById('news-body');
  try{
    const rss='https://news.google.com/rss?hl=en-CA&gl=CA&ceid=CA:en';
    const proxy='https://api.allorigins.win/get?url='+encodeURIComponent(rss);
    const r=await fetch(proxy,{cache:'no-cache'});
    const w=await r.json();
    const xml=new DOMParser().parseFromString(w.contents,'text/xml');
    const items=[...xml.querySelectorAll('item')].slice(0,3);
    if(!items.length)throw new Error('Empty feed');
    el.innerHTML=items.map((item,i)=>{
      let title=item.querySelector('title')?.textContent??'';
      const link=item.querySelector('link')?.textContent??'#';
      let source=item.querySelector('source')?.textContent??'';
      const di=title.lastIndexOf(' - ');
      if(di>0&&!source){source=title.slice(di+3);title=title.slice(0,di);}
      return`<div class="news-item" onclick="window.open('${link}','_blank')">
        <div class="news-num">Story ${i+1}</div>
        <div class="news-hed">${title}</div>
        ${source?`<div class="news-src">📰 ${source}</div>`:''}
      </div>`;
    }).join('');
  }catch(e){
    el.innerHTML=`<div style="color:var(--sub);padding:16px 0;font-size:0.82rem;">📡 News feed unavailable.<br><span style="font-family:var(--fm);font-size:0.62rem;color:var(--dim);">${e.message}</span></div>`;
  }
}
